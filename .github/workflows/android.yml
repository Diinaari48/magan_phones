name: Android CI (Build APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Missing Environment Files (.env / .env.example)
      run: |
        # Raadi folder-ka uu ku jiro project-ka
        TARGET_DIR=$(find . -maxdepth 2 -name "settings.gradle*" -exec dirname {} \;)
        echo "Target directory is: $TARGET_DIR"
        
        # Abuur file-alka .env iyo .env.example oo marso ah si uu Gradle u hesho
        touch "$TARGET_DIR/.env"
        touch "$TARGET_DIR/.env.example"
        echo "SUPABASE_URL=https://dummy.supabase.co" >> "$TARGET_DIR/.env"
        echo "SUPABASE_ANON_KEY=dummy_key" >> "$TARGET_DIR/.env"
        echo "SUPABASE_URL=https://dummy.supabase.co" >> "$TARGET_DIR/.env.example"
        echo "SUPABASE_ANON_KEY=dummy_key" >> "$TARGET_DIR/.env.example"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        TARGET_DIR=$(find . -maxdepth 2 -name "settings.gradle*" -exec dirname {} \;)
        cd "$TARGET_DIR"
        gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
