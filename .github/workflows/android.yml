name: Android CI (Build APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Find and Build Gradle Project
      run: |
        # Waxay raadinaysaa folder-ka ay ku dhex jiraan settings.gradle ama settings.gradle.kts
        BUILD_DIR=$(find . -maxdepth 2 -name "settings.gradle*" -exec dirname {} \;)
        if [ -z "$BUILD_DIR" ]; then
          echo "Error: No settings.gradle found in repository!"
          exit 1
        fi
        echo "Building in directory: $BUILD_DIR"
        cd "$BUILD_DIR"
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
